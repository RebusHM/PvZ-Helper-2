version: '3.8'

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram_bot_api
    restart: always
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
      TELEGRAM_STAT: "false"
    volumes:
      - ./data/bot_api_data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"

  pvz_helper_bot:
    build: .
    container_name: pvz_helper_bot
    restart: always
    depends_on:
      - telegram-bot-api
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
      - API_BASE_URL=http://telegram-bot-api:8081/bot
